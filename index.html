<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golfscore – 18 hål</title>
  <style>
    :root {
      --green: #176b45;
      --dark-green: #0d4930;
      --pale-green: #eaf4ee;
      --gold: #d3a632;
      --cream: #f7f5ed;
      --line: #ced8d1;
      --text: #17231c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 30px 16px;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(145deg, #e4eee7, var(--cream));
    }

    main {
      width: min(1440px, 100%);
      margin: auto;
      overflow: hidden;
      background: white;
      border-radius: 20px;
      box-shadow: 0 18px 55px rgba(23, 70, 46, 0.14);
    }

    header {
      padding: 26px clamp(20px, 4vw, 48px);
      color: white;
      background: linear-gradient(120deg, var(--dark-green), var(--green));
    }

    h1 { margin: 0 0 5px; font-size: clamp(1.7rem, 4vw, 2.5rem); }
    header p { margin: 0; opacity: 0.85; }

    .content { padding: 26px clamp(14px, 3vw, 38px) 32px; }

    .round-info {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 14px;
      max-width: 760px;
      margin-bottom: 25px;
    }

    label { display: block; font-weight: 700; }

    input, select {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      background: white;
      font: inherit;
    }

    .round-info input, .round-info select { margin-top: 6px; padding: 11px 12px; }
    input:focus, select:focus { outline: 3px solid rgba(23, 107, 69, 0.17); border-color: var(--green); }

    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }

    table {
      width: 100%;
      min-width: 1250px;
      border-collapse: collapse;
      text-align: center;
    }

    th, td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    tr:last-child td { border-bottom: 0; }
    th:last-child, td:last-child { border-right: 0; }

    th {
      padding: 12px 7px;
      color: white;
      background: var(--dark-green);
      font-size: 0.9rem;
    }

    th:nth-child(11), th:nth-child(21), th:nth-child(22) { background: #a47b14; }
    td { height: 57px; padding: 6px; background: #fbfcfb; }

    .name-cell { width: 170px; }
    .hole-cell { width: 50px; }
    .total-cell { width: 74px; }

    td input {
      height: 42px;
      padding: 5px;
      border: 0;
      text-align: center;
      background: transparent;
    }

    td input[type="text"] { padding-inline: 10px; text-align: left; }
    .calculated { font-size: 1.05rem; font-weight: 800; background: var(--pale-green); }
    .grand-total { color: var(--dark-green); background: #f8edd0; font-size: 1.15rem; }

    .note { margin: 12px 2px 0; color: #627067; font-size: 0.88rem; }
    .actions { display: flex; justify-content: flex-end; margin-top: 20px; }

    button {
      padding: 11px 16px;
      border: 0;
      border-radius: 9px;
      color: white;
      background: #91413b;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.08); }

    @media (max-width: 620px) {
      body { padding: 0; }
      main { min-height: 100vh; border-radius: 0; }
      .round-info { grid-template-columns: 1fr; }
    }

    @media print {
      body { padding: 0; background: white; }
      main { width: 100%; box-shadow: none; }
      .actions, .note { display: none; }
      .content { padding: 18px 8px; }
      .table-wrap { overflow: visible; }
      table { min-width: 0; font-size: 9px; }
      th, td { padding: 3px; }
      td { height: 38px; }
      td input { height: 30px; font-size: 10px; }
    }
  </style>
</head>

    const playerRows = [...document.querySelectorAll("tbody tr")];

    function numberValue(input) {
      const value = Number(input.value);
      return Number.isFinite(value) && value >= 0 ? value : 0;
    }

    function calculate() {
      playerRows.forEach(row => {
        const scores = [...row.querySelectorAll(".score")];
        const firstNine = scores.slice(0, 9).reduce((sum, input) => sum + numberValue(input), 0);
        const lastNine = scores.slice(9, 18).reduce((sum, input) => sum + numberValue(input), 0);
        row.querySelector("#out").textContent = firstNine;
        row.querySelector("#in").textContent = firstNine;
        row.querySelector("#total").textContent = firstNine + lastNine;
      });
    }

    function save() {
      const data = {
        date: fields.date.value,
        course: fields.course.value,
        players: playerRows.map(row => ({
          name: row.querySelector('input[type="text"]').value,
          scores: [...row.querySelectorAll(".score")].map(input => input.value)
        }))
      };
      localStorage.setItem(storageKey, JSON.stringify(data));
    }

    function update() {
      calculate();
      save();
    }

    function load() {
      let data;
      try { data = JSON.parse(localStorage.getItem(storageKey)); } catch (_) {}
      if (!data) return calculate();
      fields.date.value = data.date || "";
      fields.course.value = data.course || "";
      if (Array.isArray(data.players)) {
        playerRows.forEach((row, rowIndex) => {
          const player = data.players[rowIndex] || {};
          row.querySelector('input[type="text"]').value = player.name || "";
          row.querySelectorAll(".score").forEach((input, holeIndex) => {
            input.value = player.scores?.[holeIndex] || "";
          });
        });
      } else if (Array.isArray(data.scores)) {
        const firstRow = playerRows[0];
        firstRow.querySelector('input[type="text"]').value = data.player || "";
        firstRow.querySelectorAll(".score").forEach((input, index) => {
          input.value = data.scores[index] || "";
        });
      }
      calculate();
    }

    document.querySelector("main").addEventListener("input", update);
    document.querySelector("#reset").addEventListener("click", () => {
      if (!confirm("Vill du nollställa alla uppgifter och resultat?")) return;
      Object.values(fields).forEach(input => input.value = "");
      playerRows.forEach(row => {
        row.querySelector('input[type="text"]').value = "";
        row.querySelectorAll(".score").forEach(input => input.value = "");
      });
      update();
    });

    load();
  </script>
</body>
</html>
